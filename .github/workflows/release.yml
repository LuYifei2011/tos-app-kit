name: Validate and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run pack:release
      - name: Check Node package entry points
        run: node --input-type=module -e "await import('tos-app-core'); await import('tos-app-core/vue')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: build/release/*
          if-no-files-found: error

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go/go.sum
      - run: go test -race -count=1 ./...
        working-directory: go
      - run: go vet ./...
        working-directory: go
      - name: Cross-compile the Linux module
        working-directory: go
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, go]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: build/release
      - name: Validate version tags and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse "go/$RELEASE_TAG^{commit}")"
          cd build/release
          sha256sum --check SHA256SUMS
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" build/release/*.tgz build/release/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
